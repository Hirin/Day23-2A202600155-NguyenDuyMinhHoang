## Day 23 Track 2 — Full observability stack
## 9 services (7 core + 2 bonus). Anchors deck §10 demo + lab tracks 01-05.
## All ports bound to localhost only — no public exposure.

services:
  app:
    build:
      context: ./01-instrument-fastapi/app
      dockerfile: Dockerfile
    container_name: day23-app
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: inference-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=lab,service.namespace=aicb
      LOG_LEVEL: INFO
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [obs]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: day23-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./02-prometheus-grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./02-prometheus-grafana/prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [obs]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: day23-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./02-prometheus-grafana/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.tpl:ro
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/REPLACE/ME}
    entrypoint: >
      sh -c 'sed "s|SLACK_WEBHOOK_URL_PLACEHOLDER|$$SLACK_WEBHOOK_URL|" /etc/alertmanager/alertmanager.tpl > /etc/alertmanager/alertmanager.yml && /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml'
    networks: [obs]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: day23-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PW:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./02-prometheus-grafana/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./02-prometheus-grafana/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks: [obs]

  loki:
    image: grafana/loki:3.3.0
    container_name: day23-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./03-tracing-and-logs/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks: [obs]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: day23-jaeger
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:14250:14250"  # gRPC OTLP-compatible
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [obs]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: day23-otel-collector
    ports:
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
      - "127.0.0.1:8888:8888"  # collector self-metrics
    volumes:
      - ./03-tracing-and-logs/otel-collector/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    networks: [obs]

  # ── BONUS B1: Pyroscope (eBPF profiling) ──────────────────────
  pyroscope:
    image: grafana/pyroscope:1.5.0
    container_name: day23-pyroscope
    ports:
      - "127.0.0.1:4040:4040"
    networks: [obs]

  # ── BONUS B2: Langfuse (LLM native observability) ─────────────
  langfuse-web:
    image: langfuse/langfuse:2
    container_name: day23-langfuse
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: day23-lab-secret-change-me
      SALT: day23-lab-salt-change-me
      NEXTAUTH_URL: http://localhost:3030
      TELEMETRY_ENABLED: "false"
      LANGFUSE_LOG_LEVEL: info
    depends_on:
      langfuse-db:
        condition: service_started
    networks: [obs]

  langfuse-db:
    image: postgres:16-alpine
    container_name: day23-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks: [obs]

volumes:
  prom-data:
  grafana-data:
  langfuse-db-data:

networks:
  obs:
    driver: bridge
